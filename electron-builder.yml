appId: com.hermes.manager
productName: Hermes Manager
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: src/bridge
    to: app/src/bridge
    filter:
      - '**/*.py'
asar: true
asarUnpack:
  - '**/src/bridge/**'
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
