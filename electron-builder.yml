appId: com.hermes.manager
productName: Hermes Manager
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: src/bridge
    to: app/src/bridge
    filter:
      - '**/*.py'
  - from: build/icon.png
    to: build/icon.png
asar: true
publish:
  provider: github
  owner: LoopyLuci
  repo: Hermes-Manager
  releaseType: release
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: HermesManager-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
